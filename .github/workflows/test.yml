name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      # Hits live Nostr relays; a red run here can mean relay weather, not a
      # code fault - re-run before concluding anything.
      - run: npm test
